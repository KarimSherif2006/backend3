<div class="product-list-container">
  <h2>Our Products</h2>
  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>
  <div class="product-grid" *ngIf="!errorMessage">
    <div *ngFor="let product of products" class="product-card">
      <img [src]="product.imageUrl || 'https://via.placeholder.com/280x200'" alt="{{ product.name }}" class="product-image">
      <div class="product-info">
        <h3>{{ product.name }}</h3>
        <p>{{ product.description }}</p>
        <div class="product-options">
          <div class="form-group">
            <label for="color-{{product._id}}">Color:</label>
            <select id="color-{{product._id}}" [(ngModel)]="selectedOptions[product._id].color">
              <option *ngFor="let color of product.colors" [value]="color">{{ color }}</option>
            </select>
          </div>
          <div class="form-group">
            <label for="size-{{product._id}}">Size:</label>
            <select id="size-{{product._id}}" [(ngModel)]="selectedOptions[product._id].size">
              <option *ngFor="let size of product.sizes" [value]="size">{{ size }}</option>
            </select>
          </div>
        </div>
        <p><strong>In Stock:</strong> {{ product.stock }}</p>
        <p class="price">{{ product.price | currency }}</p>
        <button class="add-to-cart-btn" (click)="addToCart(product)">Add to Cart</button>
      </div>
    </div>
  </div>
</div>
